spring.application.name=movimente-se

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost/movimente-se}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin@123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=MovimenteSe-Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.max-lifetime=1800000